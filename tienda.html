<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda | Squad Miribilla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 font-sans">

  <header class="bg-pink-600 text-white py-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center px-6">
      <h1 class="text-2xl font-bold">Tienda Oficial</h1>
      <a href="index.html" class="hover:underline text-white">← Volver al inicio</a>
    </div>
  </header>

  <main class="container mx-auto px-6 py-12">
    <div class="grid gap-6 md:grid-cols-3">
      <div class="product-card bg-white rounded-2xl shadow p-6 text-center">
        <img src="uniforme_local.png" alt="Equipación Local" class="mx-auto h-40 object-contain mb-4">
        <h3 class="font-semibold">Equipación Local 2025</h3>
        <p class="text-pink-600 font-bold">25€</p>
      </div>

      <div class="product-card bg-white rounded-2xl shadow p-6 text-center">
        <img src="carnet.png" alt="Carnet de socio" class="mx-auto h-40 object-contain mb-4">
        <h3 class="font-semibold">Carnet de Socio 2025</h3>
        <p class="text-pink-600 font-bold">10€</p>
      </div>

      <div class="product-card bg-white rounded-2xl shadow p-6 text-center">
        <img src="bufanda.png" alt="Bufanda" class="mx-auto h-40 object-contain mb-4">
        <h3 class="font-semibold">Bufanda Oficial</h3>
        <p class="text-pink-600 font-bold">12€</p>
      </div>
    </div>
  </main>

  <footer class="bg-gray-900 text-white text-center py-4 mt-12">
    © 2025 Squad Miribilla
  </footer>

</body>
</html>
